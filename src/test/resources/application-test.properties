spring.application.name=backend-offline-first-test

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.log.path=build/test-logs

app.auth.jwt.secret=test-jwt-secret-key-at-least-32-bytes-long!!

logging.level.com.hnp.backendofflinefirst=DEBUG

spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=20000

app.import.max-rows=10000

# Attachments are written to a build-local directory so tests never touch ./data/attachments,
# and a small size cap keeps the oversize-rejection test from allocating 10 MB.
app.attachments.storage-dir=build/test-attachments
app.attachments.max-file-size-bytes=4096
app.attachments.max-image-bytes=4096
app.attachments.max-audio-bytes=4096
app.attachments.max-video-bytes=4096

# The sweep must never fire on its own during tests — it walks the storage root and deletes.
app.attachments.sweep.enabled=false
