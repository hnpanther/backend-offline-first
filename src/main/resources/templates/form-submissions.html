<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title th:text="${lockedForm != null ? lockedForm.title : 'همهٔ ارسال‌های فرم'}">ارسال‌های فرم</title></head>
<body>
<div id="pageContent" class="enterprise-list-page">

    <nav aria-label="مسیر صفحه" class="enterprise-breadcrumb">
        <ol>
            <li><a th:href="@{${homePath}}"><i class="bi bi-house-door" aria-hidden="true"></i>خانه</a></li>
            <li class="active" aria-current="page"
                th:text="${lockedForm != null ? lockedForm.title : 'همهٔ ارسال‌های فرم'}">ارسال‌های فرم</li>
        </ol>
    </nav>

    <div class="page-header enterprise-page-header d-flex flex-wrap justify-content-between align-items-center gap-2">
        <h4 class="page-title mb-0">
            <i class="bi bi-clipboard-check me-2"></i>
            <span th:if="${lockedForm != null}" th:text="${lockedForm.title}">فرم</span>
            <span th:unless="${lockedForm != null}">همهٔ ارسال‌های فرم</span>
        </h4>
        <div class="d-flex flex-wrap gap-2" sec:authorize="hasAuthority('POST:/form-submissions/draft')">
            <!--/* A form menu files only that form. The picker of every form lives on the all-submissions page. */-->
            <a th:if="${lockedForm != null}" class="btn btn-primary"
               th:href="@{/form-submissions/new(formId=${lockedForm.id})}">
                <i class="bi bi-plus-lg me-1"></i>ثبت جدید
            </a>
            <div class="dropdown" th:if="${lockedForm == null and navForms != null and !#lists.isEmpty(navForms)}">
                <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    <i class="bi bi-plus-lg me-1"></i>ثبت جدید
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li th:each="f : ${navForms}">
                        <a class="dropdown-item" th:href="@{/form-submissions/new(formId=${f.id})}"
                           th:text="${f.title}">فرم</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <form method="get" class="row g-2 mb-3 align-items-end">
        <div class="col-md-4" th:if="${lockedForm != null}">
            <label class="form-label">فرم</label>
            <input type="hidden" name="formId" th:value="${lockedForm.id}">
            <input class="form-control" th:value="${lockedForm.title}" disabled>
        </div>
        <div class="col-md-4" th:unless="${lockedForm != null}">
            <label class="form-label">فرم</label>
            <select name="formId" class="form-select">
                <option value="">همه</option>
                <option th:each="f : ${navForms}" th:value="${f.id}" th:text="${f.title}"
                        th:selected="${formId != null and formId == f.id}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">وضعیت</label>
            <select name="status" class="form-select">
                <option value="">همه</option>
                <option value="DRAFT" th:selected="${status == 'DRAFT'}">پیش‌نویس</option>
                <option value="SUBMITTED" th:selected="${status == 'SUBMITTED'}">ثبت نهایی</option>
                <option value="APPROVED" th:selected="${status == 'APPROVED'}">تأییدشده</option>
                <option value="VOIDED" th:selected="${status == 'VOIDED'}">ابطال‌شده</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-outline-primary">فیلتر</button>
        </div>
    </form>

    <div class="card enterprise-data-card">
        <div class="table-responsive-modern enterprise-table-viewport">
            <table class="table table-hover mb-0 enterprise-data-table"
                   data-enterprise-table-key="form-submissions">
                <thead>
                    <tr>
                        <th>فرم</th>
                        <th>وضعیت</th>
                        <th>گزارش‌دهنده</th>
                        <th>واحد ثبت‌کننده</th>
                        <th>ثبت نهایی</th>
                        <th>به‌روزرسانی</th>
                        <th class="text-center enterprise-operation-column">جزئیات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${submissions}">
                        <td th:text="${formTitles[s.formDefinitionId] ?: '—'}">فرم</td>
                        <td>
                            <span th:class="'badge ' + ${@formSubmissionView.statusBadgeClass(s.status)}"
                                  th:text="${@formSubmissionView.statusLabel(s.status)}">وضعیت</span>
                        </td>
                        <td th:text="${s.reportedByName} ?: '—'">—</td>
                        <td th:text="${unitLabels[s.reporterUnitId] ?: '—'}">—</td>
                        <td th:text="${@dateUtils.format(s.submittedAt)}">—</td>
                        <td th:text="${@dateUtils.format(s.updatedAt)}">—</td>
                        <td class="text-center enterprise-operation-column">
                            <a th:href="@{/form-submissions/{id}(id=${s.id})}"
                               class="btn btn-sm btn-outline-info" title="جزئیات">
                                <i class="bi bi-eye" aria-hidden="true"></i>
                                <span class="visually-hidden">جزئیات</span>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(submissions)}">
                        <td colspan="7" class="text-center text-muted py-5">ارسالی یافت نشد</td>
                    </tr>
                </tbody>
            </table>
            <div th:replace="~{fragments/list-toolbar :: pagination(basePath='/form-submissions')}"></div>
        </div>
    </div>
</div>
</body>
</html>
