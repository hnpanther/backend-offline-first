<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>تاریخچه تغییرات</title></head>
<body>
<div id="pageContent" class="enterprise-list-page">

    <nav aria-label="مسیر صفحه" class="enterprise-breadcrumb">
        <ol>
            <li><a href="/"><i class="bi bi-house-door" aria-hidden="true"></i>خانه</a></li>
            <li class="active" aria-current="page">تاریخچه تغییرات</li>
        </ol>
    </nav>
    <div class="page-header enterprise-page-header">
        <h4 class="page-title"><i class="bi bi-journal-check me-2"></i>تاریخچه تغییرات</h4>
        <span class="text-muted small" th:if="${listPage != null}" th:text="${listPage.totalElements} + ' ردیف'"></span>
    </div>

    <div th:replace="~{fragments/list-toolbar :: search(basePath='/audit-logs')}"></div>

    <div class="card">
        <div class="enterprise-table-tools" data-enterprise-tools-slot></div>
        <div class="table-responsive-modern enterprise-table-viewport">
            <table class="table table-hover table-sm mb-0 enterprise-data-table">
                <thead class="table-light">
                    <tr>
                        <th>زمان</th>
                        <th>کاربر</th>
                        <th>عملیات</th>
                        <th>موجودیت</th>
                        <th>شناسه</th>
                        <th>تغییرات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row : ${logs}">
                        <td class="text-nowrap" th:text="${@dateUtils.format(row.recordedAt)}"></td>
                        <td th:text="${row.actorUsername} ?: '—'"></td>
                        <td><span class="badge bg-secondary" th:text="${row.action}"></span></td>
                        <td th:text="${row.entityType}"></td>
                        <td><code th:text="${row.entityId}"></code></td>
                        <td>
                            <ul class="list-unstyled mb-0 small" th:if="${row.changes != null}">
                                <li th:each="c : ${row.changes}" class="value-change-row">
                                    <strong th:text="${c['field']}"></strong>
                                    <span class="value-change">
                                        <span class="text-muted" th:text="${c['oldValue']}"></span>
                                        <i class="bi bi-arrow-left" aria-hidden="true"></i>
                                        <span th:text="${c['newValue']}"></span>
                                    </span>
                                </li>
                            </ul>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(logs)}">
                        <td colspan="6" class="text-center text-muted py-5">هنوز تغییری ثبت نشده است</td>
                    </tr>
                </tbody>
            </table>
            <div th:replace="~{fragments/list-toolbar :: pagination(basePath='/audit-logs')}"></div>
        </div>
    </div>
</div>
</body>
</html>
