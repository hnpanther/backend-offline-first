<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  formData:        Map or JSON object
  fieldDefs:       optional List<FieldDefinition>
  attachmentsById: optional Map<String, Attachment> for this sheet
  logSheetId:      optional sheet id; required to build attachment URLs

  Media renders as a row of 64px tiles, not inline full-size players. One pump entry can carry
  three photos, a voice note and a video; at full size a single asset pushed the readings — the
  actual record — off the screen. Clicking a tile opens the lightbox in attachments.js.

  Bytes come from the *web* route (/log-sheets/{id}/attachments/{attachmentId}), not /api/**:
  the API chain is stateless and JWT-only, so a browser session cannot load it from an <img>.

  With no logSheetId the field degrades to "N پیوست" rather than emitting a broken URL.
-->
<div th:fragment="table(formData, fieldDefs, attachmentsById, logSheetId)" class="form-data-table">
    <table class="table table-sm table-bordered mb-0" th:if="${formData != null and !#maps.isEmpty(formData)}">
        <tbody>
            <tr th:each="row : ${@formDataView.rows(formData, fieldDefs, attachmentsById != null ? attachmentsById : {})}"
                th:classappend="${row.isEmpty()} ? 'form-data-row-empty' : ''">
                <th class="bg-light text-muted small" style="width: 35%;" th:text="${row.label}"></th>
                <td class="form-data-value">
                    <div th:if="${row.hasAttachments() and logSheetId != null}" class="att-items">
                        <div th:each="att : ${row.attachments}" class="att-item">

                            <span th:if="${att.missing}" class="att-missing">
                                فایل پیوست در دسترس نیست
                            </span>

                            <button th:unless="${att.missing}" type="button" class="att-thumb"
                                    th:attr="data-att-kind=${att.kind},
                                             data-att-url=@{'/log-sheets/' + ${logSheetId} + '/attachments/' + ${att.id}},
                                             data-att-caption=${att.captionLabel()}"
                                    th:title="${att.captionLabel()}">
                                <img th:if="${att.image}" alt="پیوست تصویری" loading="lazy"
                                     th:src="@{'/log-sheets/' + ${logSheetId} + '/attachments/' + ${att.id}}">
                                <i th:if="${att.audio}" class="bi bi-mic-fill" aria-hidden="true"></i>
                                <i th:if="${att.video}" class="bi bi-camera-video-fill" aria-hidden="true"></i>
                            </button>

                            <span th:unless="${att.missing}" class="att-item-meta"
                                  th:text="${att.captionLabel()}"></span>
                        </div>
                    </div>

                    <span th:if="${row.isEmpty()}" class="form-data-empty">
                        <i class="bi bi-dash-circle" aria-hidden="true"></i> ثبت نشده
                    </span>
                    <!-- Both wrapped in <bdi>. The page is RTL and a unit is almost always Latin
                         («B», «°C», «rpm»); ASCII parentheses are bidi-neutral and get mirrored by
                         the RTL paragraph, so «(B)» rendered on screen as «)B(». A number is only
                         weakly directional too, so a negative reading could show its sign on the
                         wrong side. <bdi> isolates each one and both read correctly.

                         The parentheses are gone rather than fixed. They were doing the work of
                         separating the reading from its unit, and a muted, smaller unit set off by
                         a space does that better — «12.5 B» is how an instrument reads it. -->
                    <span th:if="${!row.isEmpty() and (!row.hasAttachments() or logSheetId == null)}"
                          class="form-data-filled"><bdi th:text="${row.value}"></bdi></span>
                    <span th:if="${!row.isEmpty() and row.unit != null and !row.unit.isEmpty()}"
                          class="form-data-unit"><bdi th:text="${row.unit}"></bdi></span>
                    <div th:if="${row.validationMessage != null}"
                         th:class="'small mt-1 fw-semibold ' + ${row.validationAlertClass}"
                         th:text="${row.validationMessage}"></div>
                </td>
            </tr>
        </tbody>
    </table>
    <span th:if="${formData == null or #maps.isEmpty(formData)}" class="text-muted small">—</span>
</div>
</html>
