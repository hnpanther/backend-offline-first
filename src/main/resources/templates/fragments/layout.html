<!DOCTYPE html>
<html th:fragment="layout(title, content)" lang="fa" dir="rtl"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The web chain has CSRF enabled (only /api/** disables it), so any fetch() that changes
         state must send this header. Exposed here rather than per page so every script can. -->
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''">
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <title th:replace="${title}">سامانه مدیریت</title>
    <!--
      A font file is not discovered until the stylesheet naming it has been parsed, so without
      these the browser paints the whole page in a fallback face and re-lays it out once
      Vazirmatn lands. That is not only a change of letterforms: the fallback's line box is
      shorter, so every row shifts when the swap happens. Preloading the two weights the panel
      actually paints with (400 body, 700 headings/badges) makes them arrive with the CSS.

      `crossorigin` is required even though these are same-origin: @font-face fetches in
      anonymous CORS mode, and a preload without it is fetched a SECOND time rather than reused.
      Medium (500) is left out on purpose — it is used rarely enough not to be worth a
      connection during the first paint.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          th:href="@{/fonts/vazirmatn/Vazirmatn-Regular.woff2}">
    <link rel="preload" as="font" type="font/woff2" crossorigin
          th:href="@{/fonts/vazirmatn/Vazirmatn-Bold.woff2}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.rtl.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/vazirmatn.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/enterprise.css}">
    <link rel="stylesheet" th:href="@{/vendor/mds-bs-datetimepicker/mds.bs.datetimepicker.style.css}">
    <!--
      The reader's table density, applied BEFORE the first paint.

      This has to be inline and it has to be here. `enterprise-ui.js` reads the same preference,
      but it reads it at DOMContentLoaded — after the browser has already painted a table at the
      default 49px row. Someone who had once chosen «فشرده» therefore saw every list open too
      tall and snap to 37px a moment later, on every load. An external file cannot fix that: it is
      a network round trip, and the paint does not wait for it. A parser-blocking inline script in
      <head> runs before <body> exists, so nothing has been painted yet.

      It sets the value on <html>; `enterprise.css` keys the same declarations off :root for a
      table that does not yet carry its own data-density. The script still applies the per-table
      value afterwards and still wins — this only decides what the FIRST frame looks like.

      Reading the per-table keys rather than one global key means an existing reader's stored
      preference is honoured immediately, without having to touch the control again to migrate it.
      Wrapped in try/catch because a browser with storage disabled must render the page, not fail:
      the worst case here is the old behaviour, never a broken page.
    -->
    <script>
        (function () {
            try {
                var prefix = 'enterpriseTable:' + window.location.pathname + ':';
                for (var i = 0; i < localStorage.length; i++) {
                    var key = localStorage.key(i);
                    if (!key || key.lastIndexOf(prefix, 0) !== 0) continue;
                    var density = (JSON.parse(localStorage.getItem(key)) || {}).density;
                    if (density === 'compact' || density === 'comfortable') {
                        document.documentElement.setAttribute('data-density', density);
                        return;               // the first table on the page decides the frame
                    }
                }
            } catch (ignored) {
                // No stored preference is readable — the default density is already correct.
            }
        })();
    </script>
</head>
<body class="app-body">

<nav class="navbar navbar-dark app-navbar fixed-top">
    <div class="container-fluid px-3 px-lg-4">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-link text-white d-lg-none p-1 me-1" type="button" id="sidebarToggle" aria-label="منو">
                <i class="bi bi-list fs-4"></i>
            </button>
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2 mb-0" href="/">
                <span class="brand-icon"><i class="bi bi-cpu-fill"></i></span>
                <span class="d-none d-sm-inline">مدیریت ثبت داده های میدانی</span>
                <span class="d-inline d-sm-none">مدیریت ثبت داده های میدانی</span>
            </a>
            <button class="btn app-sidebar-toggle d-none d-lg-inline-flex" type="button"
                    id="desktopSidebarToggle" aria-controls="desktopSidebar" aria-expanded="true"
                    title="جمع کردن منوی کناری">
                <i class="bi bi-layout-sidebar-inset-reverse" aria-hidden="true"></i>
                <span class="visually-hidden">نمایش یا پنهان کردن منوی کناری</span>
            </button>
        </div>
        <div class="d-flex align-items-center gap-2 ms-auto app-navbar-actions">
        <span class="app-user-summary d-none d-md-inline-flex" sec:authorize="isAuthenticated()">
            <i class="bi bi-person-circle me-1"></i>
            <span sec:authentication="principal.user.fullName">کاربر</span>
        </span>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline ms-2">
            <button type="submit" class="btn btn-sm btn-outline-light">
                <i class="bi bi-box-arrow-left"></i> خروج
            </button>
        </form>
        </div>
    </div>
</nav>

<div class="d-flex app-shell">

    <!-- Desktop sidebar -->
    <nav class="app-sidebar d-none d-lg-block shadow-sm" id="desktopSidebar" aria-label="منوی اصلی">
        <div class="app-sidebar-heading">
            <span class="app-sidebar-heading-icon"><i class="bi bi-grid-1x2-fill"></i></span>
            <span><strong>پنل مدیریت</strong><small aria-hidden="true">&nbsp;</small></span>
        </div>
        <ul th:replace="~{fragments/sidebar-nav :: items}"></ul>
    </nav>

    <!-- Mobile offcanvas sidebar -->
    <div class="offcanvas offcanvas-start app-offcanvas d-lg-none" tabindex="-1" id="mobileSidebar">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title fw-bold">منوی سامانه</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="بستن منو"></button>
        </div>
        <div class="offcanvas-body p-2">
            <ul th:replace="~{fragments/sidebar-nav :: items}"></ul>
        </div>
    </div>

    <main class="app-main" id="mainContent">
        <div th:replace="${content}">محتوا</div>
    </main>
</div>

<!--
  FLASH MESSAGES — rendered in their FINAL form, on the server.

  These used to be plain `.alert` blocks inside <main>, which `enterprise-ui.js` then moved into
  a stack and rebuilt. That works, and it flashes: the browser paints the old inline alert, and a
  moment later a script deletes it and draws a toast somewhere else. The user sees the message
  twice, in two different places, in two different styles.

  A script cannot fix that — anything it does happens after the first paint by definition. So the
  markup below IS the toast. `enterprise-ui.js` only attaches behaviour (the dismiss timer, the
  hover pause, Esc) to what is already on screen, and adds nothing visual.

  It also degrades honestly: with JavaScript unavailable the message still renders, styled, in
  the right place, and its close button still works through Bootstrap's own dismiss.

  Placed outside `.app-shell` on purpose. The stack is `position: fixed`, and a `transform`,
  `filter` or `perspective` on any ancestor would make that ancestor the containing block and
  strand the toasts inside the layout instead of the viewport.
-->
<div class="enterprise-toast-stack"
     th:if="${successMessage != null or errorMessage != null or warningMessage != null
             or (importErrors != null and !#lists.isEmpty(importErrors))}"
     aria-live="polite" aria-atomic="false">

    <div th:if="${successMessage}" class="alert enterprise-toast enterprise-toast--success"
         role="status" data-toast-autodismiss="true">
        <span class="enterprise-toast__icon" aria-hidden="true"><i class="bi bi-check-lg"></i></span>
        <div class="enterprise-toast__body" th:text="${successMessage}"></div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="بستن پیام"></button>
        <span class="enterprise-toast__timer" aria-hidden="true"></span>
    </div>

    <div th:if="${errorMessage}" class="alert enterprise-toast enterprise-toast--danger" role="alert">
        <span class="enterprise-toast__icon" aria-hidden="true"><i class="bi bi-exclamation-triangle-fill"></i></span>
        <div class="enterprise-toast__body" th:text="${errorMessage}"></div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="بستن پیام"></button>
    </div>

    <div th:if="${warningMessage}" class="alert enterprise-toast enterprise-toast--warning" role="status">
        <span class="enterprise-toast__icon" aria-hidden="true"><i class="bi bi-exclamation-lg"></i></span>
        <div class="enterprise-toast__body" th:text="${warningMessage}"></div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="بستن پیام"></button>
    </div>

    <!-- A report rather than a notification: never auto-dismissed, whatever its severity. -->
    <div th:if="${importErrors != null and !#lists.isEmpty(importErrors)}"
         class="alert enterprise-toast enterprise-toast--warning" role="status">
        <span class="enterprise-toast__icon" aria-hidden="true"><i class="bi bi-exclamation-lg"></i></span>
        <div class="enterprise-toast__body">
            <div class="fw-semibold mb-1">خطاهای ورود اطلاعات:</div>
            <ul class="mb-0"><li th:each="err : ${importErrors}" th:text="${err}"></li></ul>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="بستن پیام"></button>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/mds-bs-datetimepicker/mds.bs.datetimepicker.js}"></script>
<script th:src="@{/js/persian-datetime-picker.js}"></script>
<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/enterprise-ui.js}"></script>
<script th:src="@{/js/remote-select.js}"></script>
<script th:src="@{/js/remote-multi-select.js}"></script>
<script th:src="@{/js/attachments.js}"></script>
</body>
</html>
