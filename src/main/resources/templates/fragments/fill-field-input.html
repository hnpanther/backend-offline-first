<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Renders a log-sheet fill input for a field definition.
  th:replace="~{fragments/fill-field-input :: field(field=${field}, entry=${entry})}"
-->
<div th:fragment="field(field, entry)" class="fill-field-control" th:with="fname='fd_' + ${entry.id} + '_' + ${field.key},
     current=${entry.formData != null ? entry.formData[field.key] : null},
     options=${field.validation != null ? field.validation['options'] : null},
     wRange=${field.validation != null ? field.validation['warning'] : null},
     dRange=${field.validation != null ? field.validation['danger'] : null},
     warningMin=${wRange != null ? wRange['min'] : (field.validation != null ? field.validation['min'] : null)},
     warningMax=${wRange != null ? wRange['max'] : (field.validation != null ? field.validation['max'] : null)},
     dangerMin=${dRange != null ? dRange['min'] : null},
     dangerMax=${dRange != null ? dRange['max'] : null}">

    <!-- select -->
    <select th:if="${field.dataType == 'select'}" class="form-select fill-field"
            th:name="${fname}" th:attr="data-required=${field.required},aria-required=${field.required}">
        <option value="" th:unless="${field.required}">— انتخاب —</option>
        <option th:each="opt : ${options}" th:value="${opt}" th:text="${opt}"
                th:selected="${current != null and current.toString() == opt.toString()}"></option>
    </select>

    <!-- multiselect -->
    <select th:if="${field.dataType == 'multiselect'}" class="form-select fill-field" multiple
            th:name="${fname}" th:attr="data-required=${field.required},data-multiselect=true,aria-required=${field.required}">
        <option th:each="opt : ${options}" th:value="${opt}" th:text="${opt}"
                th:selected="${current != null and (#lists.contains(current, opt) or current.toString() == opt.toString())}"></option>
    </select>

    <!-- checkbox -->
    <div th:if="${field.dataType == 'checkbox'}" class="form-check form-switch fill-checkbox-wrap">
        <input type="hidden" th:name="${fname}" value="false">
        <input type="checkbox" class="form-check-input fill-field" th:name="${fname}" value="true"
               th:id="${fname}" th:checked="${current == true or current == 'true'}"
               th:attr="data-required=${field.required},aria-required=${field.required}">
        <label class="form-check-label" th:for="${fname}">بله</label>
    </div>

    <!-- textarea -->
    <textarea th:if="${field.dataType == 'textarea'}" class="form-control fill-field" rows="3"
              th:name="${fname}" th:attr="data-required=${field.required},aria-required=${field.required}"
              placeholder="توضیحات را وارد کنید"
              th:text="${current}"></textarea>

    <!-- number (with range validation feedback) -->
    <div th:if="${field.dataType == 'number'}" class="fill-field-wrap"
         th:with="warningText=${@fieldValidation.warningText(field.validation)},
                  dangerText=${@fieldValidation.dangerText(field.validation)}">
        <input class="form-control fill-field fill-field-number"
               th:name="${fname}" type="number" step="any" inputmode="decimal"
               th:attr="data-required=${field.required},aria-required=${field.required}"
               th:data-warning-min="${warningMin}"
               th:data-warning-max="${warningMax}"
               th:data-danger-min="${dangerMin}"
               th:data-danger-max="${dangerMax}"
               th:value="${current}">

        <!--
          Static reference bands, shown before the operator types anything — the PWA has always
          rendered these under numeric fields and the web form did not, so the same reading looked
          unbounded here. The live severity message below is separate and only appears once a value
          actually falls outside a band.
        -->
        <div th:if="${warningText != null or dangerText != null}" class="fill-range-hints">
            <span th:if="${warningText != null}" class="fill-range-chip is-warning"
                  title="مقدار خارج از این بازه، هشدار محسوب می‌شود">
                <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
                <span class="fill-range-chip-label">هشدار</span>
                <bdi class="fill-range-chip-value" th:text="${warningText}"></bdi>
            </span>
            <span th:if="${dangerText != null}" class="fill-range-chip is-danger"
                  title="مقدار خارج از این بازه، خطر محسوب می‌شود">
                <i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i>
                <span class="fill-range-chip-label">خطر</span>
                <bdi class="fill-range-chip-value" th:text="${dangerText}"></bdi>
            </span>
        </div>

        <div class="validation-feedback small mt-1 d-none" aria-live="polite"></div>
    </div>

    <!--
      image / audio / video

      Uploaded one file at a time to its own endpoint, with the returned id kept in a hidden
      input the ordinary form submit carries. The alternative — binaries inside the fill form —
      would mean a whole sheet's submission failing because one photo did.

      Counts and durations come from the admin Settings page. They are enforced here for a good
      message and again on the server, which is the actual boundary.
    -->
    <div th:if="${@attachmentView.kindOf(field.dataType) != null}"
         class="att-uploader"
         th:with="kind=${@attachmentView.kindOf(field.dataType)},
                  maxCount=${attachmentLimits.maxCountFor(@attachmentView.kindEnum(field.dataType))},
                  maxSeconds=${@attachmentView.maxSecondsFor(attachmentLimits, field.dataType)},
                  existing=${@attachmentView.forEntryField(attachmentsById, entry.assetId, field.key)}"
         th:attr="data-kind=${kind},
                  data-max-count=${maxCount},
                  data-max-seconds=${maxSeconds},
                  data-asset-id=${entry.assetId},
                  data-field-key=${field.key},
                  data-field-name=${fname},
                  data-upload-url=@{'/log-sheets/' + ${logSheet.id} + '/attachments'},
                  data-delete-url-prefix=@{'/log-sheets/' + ${logSheet.id} + '/attachments/'},
                  data-view-url-prefix=@{'/log-sheets/' + ${logSheet.id} + '/attachments/'}">

        <div class="att-uploader-head">
            <button type="button" class="att-add-btn btn btn-outline-secondary btn-sm">
                <i th:class="${kind == 'IMAGE'} ? 'bi bi-camera me-1' : (${kind == 'AUDIO'} ? 'bi bi-mic me-1' : 'bi bi-camera-video me-1')"
                   aria-hidden="true"></i>
                <span th:text="${kind == 'IMAGE'} ? 'افزودن تصویر' : (${kind == 'AUDIO'} ? 'افزودن صوت' : 'افزودن ویدئو')"></span>
            </button>
            <span class="att-count"></span>
            <span th:if="${maxSeconds > 0}" class="text-muted small"
                  th:text="'حداکثر ' + ${maxSeconds} + ' ثانیه'"></span>
        </div>

        <input type="file" class="att-file-input d-none"
               th:accept="${kind == 'IMAGE'} ? 'image/*' : (${kind == 'AUDIO'} ? 'audio/*' : 'video/*')"
               th:attr="capture=${kind == 'IMAGE'} ? 'environment' : null">

        <div class="att-items">
            <div th:each="att : ${existing}" class="att-item">
                <button type="button" class="att-thumb"
                        th:attr="data-att-kind=${att.kind},
                                 data-att-url=@{'/log-sheets/' + ${logSheet.id} + '/attachments/' + ${att.id}},
                                 data-att-caption=${att.sizeLabel()}">
                    <img th:if="${att.image}" alt="پیوست"
                         th:src="@{'/log-sheets/' + ${logSheet.id} + '/attachments/' + ${att.id}}">
                    <i th:if="${att.audio}" class="bi bi-mic-fill" aria-hidden="true"></i>
                    <i th:if="${att.video}" class="bi bi-camera-video-fill" aria-hidden="true"></i>
                </button>
                <span class="att-item-meta" th:text="${att.sizeLabel()}"></span>
                <input type="hidden" th:name="${fname}" th:value="${att.id}">
                <button type="button" class="att-remove btn btn-sm btn-link text-danger p-0"
                        th:attr="data-att-id=${att.id}" title="حذف">
                    <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
            </div>
        </div>

        <div class="att-status small text-muted"></div>
    </div>

    <!--
      A GPS coordinate. The mobile app captures it from the device; on the web there is no
      device position to read, so the two numbers are typed in — a supervisor correcting a
      reading, or filling one in from a survey.

      Two inputs share ONE form field name on purpose. The browser submits same-named controls
      in document order (HTML spec), so the server receives exactly [lat, lng] and normalises
      that pair into the stored object. The alternative — a single "35.68, 51.38" box — pushes
      a parsing rule onto whoever is typing and gets the order wrong sooner or later.
    -->
    <div th:if="${@attachmentView.isLocationField(field.dataType)}" class="fill-field-control">
        <div class="row g-2 location-field" th:attr="data-field-name=${fname}">
            <div class="col-6">
                <div class="input-group input-group-sm">
                    <span class="input-group-text">عرض</span>
                    <input type="number" step="any" min="-90" max="90"
                           class="form-control location-lat"
                           th:name="${fname}" th:value="${@attachmentView.locationLat(current)}"
                           placeholder="35.689200">
                </div>
            </div>
            <div class="col-6">
                <div class="input-group input-group-sm">
                    <span class="input-group-text">طول</span>
                    <input type="number" step="any" min="-180" max="180"
                           class="form-control location-lng"
                           th:name="${fname}" th:value="${@attachmentView.locationLng(current)}"
                           placeholder="51.389000">
                </div>
            </div>
        </div>
        <div class="form-text">
            مختصات جغرافیایی (WGS-84). در اپلیکیشن موبایل از GPS دستگاه خوانده می‌شود؛
            اینجا می‌توانید دستی وارد یا اصلاح کنید. برای پاک کردن، هر دو کادر را خالی بگذارید.
        </div>
    </div>

    <!-- default text -->
    <input th:if="${field.dataType != 'select' and field.dataType != 'multiselect'
                    and field.dataType != 'checkbox' and field.dataType != 'textarea'
                    and field.dataType != 'number'
                    and @attachmentView.kindOf(field.dataType) == null
                    and !@attachmentView.isLocationField(field.dataType)}"
           class="form-control fill-field"
           th:name="${fname}" type="text"
           th:attr="data-required=${field.required},aria-required=${field.required}"
           placeholder="مقدار را وارد کنید"
           th:value="${current}">
</div>

</body>
</html>
