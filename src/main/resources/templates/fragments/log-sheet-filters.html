<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  The extra filters on /log-sheets, for the shared list toolbar's `extraFilters` slot.

  WHY THIS IS ITS OWN FILE. The inline idiom — `th:with="extraFilters=~{:: someFragment}"` with
  the fragment element sitting in the page — renders the fragment TWICE: once where the toolbar
  includes it, and once in place, because `th:fragment` does not suppress its own element.
  Measured on /asset-entries, which carries that shape and draws its «کلاس دارایی» filter two
  times. A fragment in its own file is included where it is asked for and nowhere else.

  Everything here is laid out with the classes enterprise.css already defines for filter bars;
  nothing new is loaded, and nothing comes from a CDN.
-->
<th:block th:fragment="filters">

    <!--/* The toggle, and the one rule that makes collapsing safe.

         A closed bar must never hide a filter that is CHANGING THE ROWS. Landing on a filtered
         list with the controls folded away is a list that is quietly lying: rows are missing
         and nothing on screen says why. So `data-filters-active` is written by the SERVER, which
         is the only side that knows, and the pre-paint rule below is written not to apply when
         it is present. The operator's stored preference decides the empty case and nothing else.

         The count is on the button for the same reason one level down: even open, «۲ فیلد» is
         faster to read than scanning three controls for the ones that are set. */-->
    <div class="col-auto enterprise-filter-toggle-field">
        <button type="button" class="btn btn-sm btn-outline-secondary enterprise-filter-toggle"
                data-filter-toggle
                th:attrappend="aria-expanded=${activeFilterCount > 0} ? 'true' : null"
                aria-controls="logSheetAdvancedFilters">
            <i class="bi bi-sliders" aria-hidden="true"></i>
            <span>فیلترها</span>
            <span class="enterprise-filter-count" th:if="${activeFilterCount > 0}"
                  th:text="${activeFilterCount}">0</span>
            <i class="bi bi-chevron-down enterprise-filter-chevron" aria-hidden="true"></i>
        </button>
    </div>

    <div class="col-12 enterprise-filter-advanced" id="logSheetAdvancedFilters" data-filter-advanced>
    <div class="row g-2 align-items-end">

    <div class="col-6 col-md-2">
        <label class="form-label small mb-1" for="filterStatusSelect">
            <i class="bi bi-flag me-1" aria-hidden="true"></i>وضعیت
        </label>
        <select id="filterStatusSelect" name="status" class="form-select form-select-sm">
            <option value="" th:selected="${filterStatus == null}">همه</option>
            <option value="PENDING" th:selected="${filterStatus == 'PENDING'}">در انتظار پیک‌آپ</option>
            <option value="ASSIGNED" th:selected="${filterStatus == 'ASSIGNED'}">انتساب‌شده</option>
            <option value="IN_PROGRESS" th:selected="${filterStatus == 'IN_PROGRESS'}">در حال انجام</option>
            <option value="SUBMITTED" th:selected="${filterStatus == 'SUBMITTED'}">تکمیل‌شده</option>
            <option value="APPROVED" th:selected="${filterStatus == 'APPROVED'}">تأییدشده</option>
            <option value="VOIDED" th:selected="${filterStatus == 'VOIDED'}">ابطال‌شده</option>
            <option value="EXPIRED" th:selected="${filterStatus == 'EXPIRED'}">منقضی</option>
            <option value="CANCELLED" th:selected="${filterStatus == 'CANCELLED'}">لغو‌شده</option>
        </select>
    </div>

    <!--/* One labelled group instead of three loose fields: «کدام تاریخ» then «از» then «تا»
         reads as one sentence, and the bar goes from five controls to three groups.

         The date filter names its column deliberately. ایجاد / مهلت / تکمیل answer three
         different questions and give three different row sets, so a range with no named column
         is read as whichever one the reader had in mind; the server refuses an unknown name
         rather than falling back — see LogSheetDateField. */-->
    <div class="col-12 col-md-5">
        <label class="form-label small mb-1" for="filterDateField">
            <i class="bi bi-calendar-range me-1" aria-hidden="true"></i>بازه تاریخ
        </label>
        <div class="row g-1 enterprise-date-range">
            <div class="col-12 col-sm-4">
                <select id="filterDateField" name="dateField" class="form-select form-select-sm"
                        title="با «زمان تکمیل»، لاگ‌شیت‌های ناتمام در نتایج نمی‌آیند — چون هنوز زمان تکمیلی ندارند.">
                    <option value="CREATED_AT" th:selected="${filterDateField == 'CREATED_AT'}">تاریخ ایجاد</option>
                    <option value="DUE_AT" th:selected="${filterDateField == 'DUE_AT'}">مهلت تکمیل</option>
                    <option value="COMPLETED_AT" th:selected="${filterDateField == 'COMPLETED_AT'}">زمان تکمیل</option>
                </select>
            </div>
            <div class="col-6 col-sm-4">
                <div th:replace="~{fragments/persian-datetime-input :: input(name='fromAt', value=${fromInput}, required=false, extraClass='form-control-sm')}"></div>
            </div>
            <div class="col-6 col-sm-4">
                <div th:replace="~{fragments/persian-datetime-input :: input(name='toAt', value=${toInput}, required=false, extraClass='form-control-sm')}"></div>
            </div>
        </div>
    </div>

    <!--/* Roadmap §26: who, what and which kind of round. Every one of these NARROWS the rows the
         viewer may already see — the server intersects each with their units and never widens
         past them — and each searchable picker asks the server under the same scope, so it can
         only offer what the list could show. The current choice is rendered as a pre-selected
         option, labelled under that same scope (LogSheetFilterOptionsService). */-->
    <div class="col-12 col-md-4">
        <label class="form-label small mb-1" for="filterUnitSelect">
            <i class="bi bi-diagram-3 me-1" aria-hidden="true"></i>واحد عملیاتی
        </label>
        <select id="filterUnitSelect" name="unitId" class="form-select form-select-sm remote-select"
                data-remote-url="/log-sheets/options/filter-units"
                data-placeholder="جستجوی واحد (نام یا کد)…"
                data-empty-label="همه واحدها">
            <option value="">همه واحدها</option>
            <option th:if="${filter != null and filter.unitId() != null}"
                    th:value="${filter.unitId()}"
                    th:text="${filterUnitLabel != null ? filterUnitLabel : ('#' + filter.unitId())}"
                    selected></option>
        </select>
    </div>

    <div class="col-12 col-md-4">
        <label class="form-label small mb-1" for="filterTemplateSelect">
            <i class="bi bi-file-earmark-text me-1" aria-hidden="true"></i>قالب
        </label>
        <select id="filterTemplateSelect" name="templateId" class="form-select form-select-sm remote-select"
                data-remote-url="/log-sheets/options/filter-templates"
                data-placeholder="جستجوی نام قالب…"
                data-empty-label="همه قالب‌ها">
            <option value="">همه قالب‌ها</option>
            <option th:if="${filter != null and filter.templateId() != null}"
                    th:value="${filter.templateId()}"
                    th:text="${filterTemplateLabel != null ? filterTemplateLabel : ('#' + filter.templateId())}"
                    selected></option>
        </select>
    </div>

    <div class="col-12 col-md-4">
        <label class="form-label small mb-1" for="filterAssigneeSelect">
            <i class="bi bi-person me-1" aria-hidden="true"></i>مسئول
        </label>
        <select id="filterAssigneeSelect" name="assigneeUserId" class="form-select form-select-sm remote-select"
                data-remote-url="/log-sheets/options/filter-assignees"
                data-placeholder="جستجوی نام یا نام کاربری…"
                data-empty-label="همه افراد">
            <option value="">همه افراد</option>
            <option th:if="${filter != null and filter.assigneeUserId() != null}"
                    th:value="${filter.assigneeUserId()}"
                    th:text="${filterAssigneeLabel != null ? filterAssigneeLabel : ('#' + filter.assigneeUserId())}"
                    selected></option>
        </select>
    </div>

    <!--/* A small table, so all of it — retired categories included, because older rounds still
         carry them and are still worth finding. */-->
    <div class="col-6 col-md-3">
        <label class="form-label small mb-1" for="filterCategorySelect">
            <i class="bi bi-bookmarks me-1" aria-hidden="true"></i>دسته
        </label>
        <select id="filterCategorySelect" name="categoryId" class="form-select form-select-sm">
            <option value="" th:selected="${filter == null or filter.categoryId() == null}">همه دسته‌ها</option>
            <option th:each="c : ${categories}"
                    th:value="${c.id}"
                    th:text="${c.active} ? ${c.name} : ${c.name + ' · غیرفعال'}"
                    th:selected="${filter != null and filter.categoryId() != null and filter.categoryId() == c.id}"></option>
        </select>
    </div>

    <div class="col-6 col-md-3">
        <label class="form-label small mb-1" for="filterOriginSelect">
            <i class="bi bi-signpost-split me-1" aria-hidden="true"></i>نحوه ایجاد
        </label>
        <select id="filterOriginSelect" name="origin" class="form-select form-select-sm">
            <option value="" th:selected="${filter == null or filter.origin() == null}">همه</option>
            <option value="SCHEDULED" th:selected="${filter != null and filter.origin() != null and filter.origin().name() == 'SCHEDULED'}">زمان‌بندی‌شده</option>
            <option value="MANUAL" th:selected="${filter != null and filter.origin() != null and filter.origin().name() == 'MANUAL'}">دستی</option>
        </select>
    </div>

    <!--/* The dashboard's «عقب‌افتاده», by the same three conditions — still open, has a
         deadline, deadline passed. Usually empty: the expiry job moves such a round to «منقضی»
         within a minute, so a persistently non-empty answer means that job is not running. */-->
    <div class="col-12 col-md-3 d-flex align-items-end">
        <div class="form-check mb-1">
            <input class="form-check-input" type="checkbox" id="filterOverdue" name="overdue" value="true"
                   th:checked="${filter != null and filter.overdueOnly()}">
            <label class="form-check-label small" for="filterOverdue">فقط عقب‌افتاده (باز و از مهلت گذشته)</label>
        </div>
    </div>

    <!--/* The things about this bar that are not guessable, in one line each. */-->
    <div class="col-12 enterprise-filter-hint">
        <i class="bi bi-info-circle" aria-hidden="true"></i>
        <span>جستجو روی <strong>نام قالب</strong>، <strong>نام مسئول</strong>، <strong>واحد عملیاتی</strong> (نام یا کد) و <strong>شماره لاگ‌شیت</strong> است. بازه تاریخ نیمه‌باز است: «از» شامل می‌شود، «تا» نه. فیلتر واحد فقط همان واحد را نشان می‌دهد، نه زیرواحدهایش.</span>
    </div>

    </div>
    </div>

</th:block>

</body>
</html>
