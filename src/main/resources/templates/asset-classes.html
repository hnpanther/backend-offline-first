<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>کلاس‌های دارایی</title></head>
<body>
<div id="pageContent" class="enterprise-list-page">

    <nav aria-label="مسیر صفحه" class="enterprise-breadcrumb">
        <ol>
            <li><a href="/"><i class="bi bi-house-door" aria-hidden="true"></i>خانه</a></li>
            <li class="active" aria-current="page">کلاس‌های دارایی</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4 page-header enterprise-page-header">
        <h4 class="mb-0 fw-bold page-title"><i class="bi bi-boxes text-primary me-2"></i>کلاس‌های دارایی</h4>
        <div class="d-flex gap-2 enterprise-page-actions">
            <a sec:authorize="hasAuthority('GET:/asset-classes')" th:href="@{/asset-classes/export}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-download me-1"></i>خروجی اکسل
            </a>
            <button sec:authorize="hasAuthority('POST:/asset-classes')" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">
                <i class="bi bi-plus-lg me-1"></i>افزودن کلاس
            </button>
        </div>
    </div>

    <div th:replace="~{fragments/list-toolbar :: search(basePath='/asset-classes')}"></div>

    <div class="card shadow-sm enterprise-data-card">
        <div class="card-body p-0">
            <div class="enterprise-table-tools" data-enterprise-tools-slot></div>
            <div class="enterprise-table-viewport">
            <table class="table table-hover mb-0 enterprise-data-table" data-enterprise-table-key="0">
                <thead class="table-light">
                    <tr><th>شناسه</th><th class="enterprise-primary-column">نام</th><th>تاریخ ایجاد</th><th>تاریخ بروزرسانی</th><th class="text-center enterprise-operation-wide enterprise-operation-column">عملیات</th></tr>
                </thead>
                <tbody>
                    <tr th:each="ac : ${assetClasses}">
                        <td class="enterprise-technical-cell" dir="auto"><code th:text="${ac.id}"></code></td>
                        <td th:text="${ac.name}" class="enterprise-primary-cell"></td>
                        <td th:text="${@dateUtils.format(ac.createdAt)}"></td>
                        <td th:text="${@dateUtils.format(ac.updatedAt)}"></td>
                        <td class="text-center enterprise-operation-wide enterprise-operation-column">
                            <a sec:authorize="hasAuthority('GET:/asset-classes/{classId}/fields')" th:href="@{/asset-classes/{id}/fields(id=${ac.id})}" class="btn btn-sm btn-outline-info me-1 enterprise-operation-text" title="مدیریت فیلدها">
                                <i class="bi bi-list-ul" aria-hidden="true"></i><span>فیلدها</span>
                            </a>
                            <a sec:authorize="hasAuthority('POST:/asset-classes/{id}')" th:href="@{/asset-classes(editId=${ac.id}, q=${q}, page=${pageNumber})}" class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-pencil"></i></a>
                            <form sec:authorize="hasAuthority('POST:/asset-classes/{id}/delete')" th:action="@{/asset-classes/{id}/delete(id=${ac.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('آیا از حذف اطمینان دارید؟')">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(assetClasses)}" class="enterprise-empty-row">
                        <td colspan="5" class="text-center text-muted py-5 enterprise-empty-cell">هیچ کلاسی ثبت نشده است</td>
                    </tr>
                </tbody>
            </table>
            </div>
            <div th:replace="~{fragments/list-toolbar :: pagination(basePath='/asset-classes')}"></div>
        </div>
    </div>

    <!-- Add Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/asset-classes}" method="post">
                    <div class="modal-header"><h5 class="modal-title">افزودن کلاس دارایی</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <div class="mb-3"><label class="form-label">نام کلاس *</label>
                            <input type="text" name="name" class="form-control" placeholder="مثال: پمپ سانتریفیوژ"
                                   required maxlength="255" pattern=".*\S.*"
                                   title="نام کلاس الزامی است و نمی‌تواند فقط فاصله باشد."></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
                        <button type="submit" class="btn btn-primary">ذخیره</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:if="${editEntity != null}" th:action="@{/asset-classes/{id}(id=${editEntity.id})}" method="post">
                    <div class="modal-header"><h5 class="modal-title">ویرایش کلاس دارایی</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <div class="mb-3"><label class="form-label">نام کلاس *</label>
                            <input type="text" name="name" class="form-control" th:value="${editEntity.name}"
                                   required maxlength="255" pattern=".*\S.*"
                                   title="نام کلاس الزامی است و نمی‌تواند فقط فاصله باشد."></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
                        <button type="submit" class="btn btn-primary">ذخیره تغییرات</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script th:if="${editEntity != null}">
        document.addEventListener('DOMContentLoaded', () => new bootstrap.Modal(document.getElementById('editModal')).show());
    </script>
</div>
</body>
</html>
