<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>نقش‌ها و دسترسی‌ها</title></head>
<body>
<div id="pageContent">

    <div class="page-header">
        <h4 class="page-title"><i class="bi bi-shield-check me-2"></i>نقش‌ها و دسترسی‌ها</h4>
        <div class="d-flex gap-2">
            <a sec:authorize="hasAuthority('GET:/roles')" th:href="@{/roles/export}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-download me-1"></i>خروجی اکسل
            </a>
            <button sec:authorize="hasAuthority('POST:/roles')" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">
                <i class="bi bi-plus-lg me-1"></i>نقش جدید
            </button>
        </div>
    </div>

    <div th:replace="~{fragments/list-toolbar :: search(basePath='/roles')}"></div>

    <div class="card">
        <div class="table-responsive-modern">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>شناسه</th>
                        <th>کد</th>
                        <th>نام</th>
                        <th>توضیح</th>
                        <th>نوع</th>
                        <th>تاریخ ایجاد</th>
                        <th>آخرین ویرایش</th>
                        <th class="text-center">عملیات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="role : ${roles}">
                        <td><code th:text="${role.id}"></code></td>
                        <td><code th:text="${role.code}"></code></td>
                        <td th:text="${role.name}"></td>
                        <td th:text="${role.description} ?: '—'"></td>
                        <td>
                            <span th:if="${role.systemRole}" class="badge bg-secondary">سیستمی</span>
                            <span th:unless="${role.systemRole}" class="badge bg-primary">سفارشی</span>
                        </td>
                        <td th:text="${@dateUtils.format(role.createdAt)}"></td>
                        <td th:text="${@dateUtils.format(role.updatedAt)}"></td>
                        <td class="text-center text-nowrap">
                            <!-- System roles are immutable: they are the reference the seeds, the
                                 code and the documentation all describe, and editing one makes
                                 those three disagree silently. Customising goes through the copy
                                 button beside this, which now produces a role that genuinely
                                 behaves like the original. -->
                            <a sec:authorize="hasAuthority('POST:/roles/{id}')" th:unless="${role.systemRole}"
                               th:href="@{/roles(editId=${role.id}, q=${q}, page=${pageNumber})}"
                               class="btn btn-sm btn-outline-secondary me-1" title="ویرایش">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <span th:if="${role.systemRole}" class="btn btn-sm btn-outline-secondary me-1 disabled"
                                  title="نقش سیستمی قابل ویرایش نیست — از «ساخت نقش مشابه» استفاده کنید"
                                  aria-disabled="true">
                                <i class="bi bi-lock"></i>
                            </span>
                            <button sec:authorize="hasAuthority('POST:/roles')" type="button"
                                    class="btn btn-sm btn-outline-primary me-1 js-duplicate-role"
                                    th:data-role-id="${role.id}" th:data-role-code="${role.code}"
                                    th:data-role-name="${role.name}"
                                    data-bs-toggle="modal" data-bs-target="#duplicateModal"
                                    title="ساخت نقش مشابه">
                                <i class="bi bi-files"></i>
                            </button>
                            <form sec:authorize="hasAuthority('POST:/roles/{id}/delete')" th:if="${!role.systemRole}" th:action="@{/roles/{id}/delete(id=${role.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('حذف این نقش؟')">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div th:replace="~{fragments/list-toolbar :: pagination(basePath='/roles')}"></div>
        </div>
    </div>

    <!-- Duplicate Modal -->
    <div class="modal fade" id="duplicateModal" tabindex="-1">
        <div class="modal-dialog">
            <form th:action="@{/roles/0/duplicate}" method="post" id="duplicateForm">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">ساخت نقش مشابه</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="alert alert-info py-2 small">
                            همه دسترسی‌های نقش <strong id="duplicateSourceName">—</strong>
                            (<code id="duplicateSourceCode">—</code>) در نقش جدید کپی می‌شود.
                            پس از ساخت می‌توانید آن را ویرایش کنید. کاربران نقش اصلی منتقل نمی‌شوند.
                        </div>
                        <div class="mb-3">
                            <label class="form-label">کد نقش جدید <span class="text-danger">*</span></label>
                            <input type="text" name="code" id="duplicateCode" class="form-control" required
                                   autocomplete="off" placeholder="مثال: SUPERVISOR_READONLY">
                            <div class="form-text">یکتا و ترجیحاً با حروف بزرگ انگلیسی.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">نام نقش جدید <span class="text-danger">*</span></label>
                            <input type="text" name="name" id="duplicateName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">توضیح</label>
                            <input type="text" name="description" class="form-control"
                                   placeholder="اختیاری — اگر خالی بماند توضیح نقش اصلی کپی می‌شود">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
                        <button type="submit" class="btn btn-primary">ساخت نقش</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable modal-permissions">
            <div class="modal-content">
                <form th:action="@{/roles}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">افزودن نقش</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">کد <span class="text-danger">*</span></label>
                                <input type="text" name="code" class="form-control" required placeholder="CUSTOM_ROLE">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">نام <span class="text-danger">*</span></label>
                                <input type="text" name="name" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">توضیح</label>
                            <input type="text" name="description" class="form-control">
                        </div>
                        <label class="form-label fw-semibold">دسترسی endpointها</label>
                        <div class="permissions-picker">
                            <div th:each="entry : ${permissionsByCategory}" class="permissions-category">
                                <div class="permissions-category__title" th:text="${@permissionCategories.label(entry.key)}"></div>
                                <div class="permissions-category__list">
                                    <div th:each="perm : ${entry.value}" class="permission-item">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="permissionIds"
                                                   th:id="${'add-perm-' + perm.id}" th:value="${perm.id}">
                                            <label class="form-check-label permission-item__label" th:for="${'add-perm-' + perm.id}">
                                                <span class="badge permission-method"
                                                      th:if="${perm.httpMethod != null}"
                                                      th:classappend="${perm.httpMethod == 'GET'} ? ' permission-method--get' : ' permission-method--post'"
                                                      th:text="${perm.httpMethod}">GET</span>
                                                <code class="permission-path" th:if="${perm.endpointPath != null}" th:text="${perm.endpointPath}">/path</code>
                                                <span class="permission-name" th:text="${perm.name}"></span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
                        <button type="submit" class="btn btn-primary">ذخیره</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable modal-permissions">
            <div class="modal-content">
                <form th:if="${editEntity != null}" th:action="@{/roles/{id}(id=${editEntity.id})}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">ویرایش نقش: <span th:text="${editEntity.code}"></span></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">نام</label>
                            <input type="text" name="name" class="form-control" th:value="${editEntity.name}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">توضیح</label>
                            <input type="text" name="description" class="form-control" th:value="${editEntity.description}">
                        </div>
                        <label class="form-label fw-semibold">دسترسی endpointها</label>
                        <div class="permissions-picker">
                            <div th:each="entry : ${permissionsByCategory}" class="permissions-category">
                                <div class="permissions-category__title" th:text="${@permissionCategories.label(entry.key)}"></div>
                                <div class="permissions-category__list">
                                    <div th:each="perm : ${entry.value}" class="permission-item">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="permissionIds"
                                                   th:id="${'edit-perm-' + perm.id}" th:value="${perm.id}"
                                                   th:checked="${selectedPermissionIds != null and selectedPermissionIds.contains(perm.id)}">
                                            <label class="form-check-label permission-item__label" th:for="${'edit-perm-' + perm.id}">
                                                <span class="badge permission-method"
                                                      th:if="${perm.httpMethod != null}"
                                                      th:classappend="${perm.httpMethod == 'GET'} ? ' permission-method--get' : ' permission-method--post'"
                                                      th:text="${perm.httpMethod}">GET</span>
                                                <code class="permission-path" th:if="${perm.endpointPath != null}" th:text="${perm.endpointPath}">/path</code>
                                                <span class="permission-name" th:text="${perm.name}"></span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
                        <button type="submit" class="btn btn-primary">ذخیره تغییرات</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:if="${editEntity != null}">
        document.addEventListener('DOMContentLoaded', () => new bootstrap.Modal(document.getElementById('editModal')).show());
    </script>

    <script>
        // Retargets the duplicate form to whichever row was clicked. The form's th:action is a
        // placeholder (/roles/0/duplicate) because Thymeleaf renders one shared modal, not one
        // per row — rewriting the id here keeps a single modal instead of N in the DOM.
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('duplicateForm');
            if (!form) return;
            document.querySelectorAll('.js-duplicate-role').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.roleId;
                    const code = btn.dataset.roleCode || '';
                    const name = btn.dataset.roleName || '';
                    form.setAttribute('action', '/roles/' + id + '/duplicate');
                    document.getElementById('duplicateSourceName').textContent = name;
                    document.getElementById('duplicateSourceCode').textContent = code;
                    // Pre-fill with an obvious, editable starting point rather than blanks.
                    document.getElementById('duplicateCode').value = code + '_COPY';
                    document.getElementById('duplicateName').value = name + ' (کپی)';
                });
            });
        });
    </script>
</div>
</body>
</html>
