<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>گزارش‌های خرابی NFC</title></head>
<body>
<div id="pageContent" class="enterprise-list-page operations-page">
    <link rel="stylesheet" th:href="@{/css/operations-pages.css}">

    <nav aria-label="مسیر صفحه" class="enterprise-breadcrumb">
        <ol>
            <li><a th:href="@{${homePath}}"><i class="bi bi-house-door" aria-hidden="true"></i>خانه</a></li>
            <li class="active" aria-current="page">گزارش‌های خرابی NFC</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4 page-header enterprise-page-header">
        <h1 class="h4 page-title mb-0"><i class="bi bi-exclamation-diamond me-2" aria-hidden="true"></i>گزارش‌های خرابی NFC</h1>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">
                <span th:text="${openCount}">0</span> باز
            </span>
            <!-- The queue's total, not this page's row count: `#lists.size(reports)` said "25
                 گزارش" on every page once the list was paginated. -->
            <span class="badge bg-secondary-subtle text-secondary-emphasis">
                <span th:text="${totalElements}">0</span> گزارش
            </span>
        </div>
    </div>

    <div class="operations-note">
        <i class="bi bi-info-circle me-1"></i>
        گزارش خرابی NFC، ثبت بدون اسکن را برای همان دارایی و لاگ‌شیت ممکن می‌کند. متن گزارش پس از ثبت قابل ویرایش نیست.
    </div>

    <div class="card shadow-sm border-0 mb-3 operations-filter-card">
        <div class="card-body">
            <div class="operations-filter-heading"><i class="bi bi-funnel" aria-hidden="true"></i>فیلتر گزارش‌ها</div>
            <!-- `page` is reset on every filter change: staying on page 4 of a list that just
                 became three pages long shows an empty table and looks like a bug. -->
            <form th:action="@{/nfc-fault-reports}" method="get" class="row g-3 align-items-end enterprise-filter-bar">
                <input type="hidden" name="page" value="0">
                <div class="col-sm-6 col-md-4">
                    <label for="nfcSearch" class="form-label small fw-semibold text-muted">
                        <i class="bi bi-search me-1"></i>جستجو
                    </label>
                    <input id="nfcSearch" type="search" name="q" class="form-control form-control-sm" th:value="${q}"
                           placeholder="کد یا نام دارایی، گزارش‌دهنده، توضیحات…">
                </div>
                <div class="col-sm-6 col-md-3">
                    <label for="nfcStatus" class="form-label small fw-semibold text-muted">وضعیت</label>
                    <select id="nfcStatus" name="status" class="form-select form-select-sm" onchange="this.form.submit()">
                        <option value="" th:selected="${statusFilter == ''}">همه</option>
                        <option value="OPEN" th:selected="${statusFilter == 'OPEN'}">باز</option>
                        <option value="REVIEWED" th:selected="${statusFilter == 'REVIEWED'}">بررسی شده</option>
                    </select>
                </div>
                <div class="col-auto">
                    <label for="nfcPageSize" class="form-label small fw-semibold text-muted">
                        <i class="bi bi-list-ol me-1"></i>تعداد در صفحه
                    </label>
                    <select id="nfcPageSize" name="size" class="form-select form-select-sm" onchange="this.form.submit()">
                        <option th:each="sz : ${T(com.hnp.backendofflinefirst.ui.WebListSupport).PAGE_SIZES}"
                                th:value="${sz}" th:text="${sz}"
                                th:selected="${pageSize != null and pageSize == sz}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-sm btn-primary">
                        <i class="bi bi-search me-1"></i>جستجو
                    </button>
                    <a th:href="@{/nfc-fault-reports}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-x-lg me-1"></i>پاک‌کردن
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card enterprise-data-card">
        <div class="card-body p-0">
            <div class="enterprise-table-tools" data-enterprise-tools-slot></div>
            <div class="enterprise-table-viewport">
            <table class="table table-hover mb-0 align-middle enterprise-data-table" data-enterprise-table-key="0">
                <thead class="table-light">
                    <tr>
                        <th>لاگ‌شیت</th>
                        <th class="enterprise-primary-column">دارایی</th>
                        <th>منبع</th>
                        <th>گزارش‌دهنده</th>
                        <th>توضیحات</th>
                        <th>زمان ثبت</th>
                        <th>وضعیت</th>
                        <th class="text-center enterprise-operation-column">عملیات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${reports}"
                        th:data-request-asset="${assetById[r.assetId] != null ? assetById[r.assetId].assetCode : '#' + r.assetId}"
                        th:data-request-status="${'#' + r.id}">
                        <td>
                            <a th:if="${logSheetById[r.logSheetId] != null}"
                               th:href="@{/log-sheets/{id}(id=${r.logSheetId})}"
                               th:text="${logSheetById[r.logSheetId].templateName} ?: ('#' + ${r.logSheetId})"></a>
                            <span th:if="${logSheetById[r.logSheetId] == null}" th:text="'#' + ${r.logSheetId}"></span>
                        </td>
                        <td class="enterprise-primary-cell">
                            <code th:if="${assetById[r.assetId] != null}" th:text="${assetById[r.assetId].assetCode}"></code>
                            <span th:text="${assetById[r.assetId] != null} ? ${assetById[r.assetId].assetName} : ('#' + ${r.assetId})"></span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${r.source.name() == 'WEB'} ? 'bg-info-subtle text-info-emphasis' : 'bg-primary-subtle text-primary-emphasis'"
                                  th:text="${r.source.name() == 'WEB'} ? 'وب' : 'موبایل'"></span>
                        </td>
                        <td th:text="${r.reportedByName} ?: '—'"></td>
                        <td class="operations-description" th:text="${r.reason} ?: '—'"></td>
                        <td th:text="${@dateUtils.format(r.createdAt)}"></td>
                        <td th:with="isReviewed=${r.status.name() == 'REVIEWED'}">
                            <span class="badge status-badge"
                                  th:classappend="${isReviewed} ? 'bg-success-subtle text-success-emphasis' : 'bg-warning-subtle text-warning-emphasis'"
                                  th:text="${isReviewed} ? 'بررسی شده' : 'باز'"></span>
                            <div th:if="${isReviewed}" class="text-muted small mt-1">
                                <!-- The null check on the id comes FIRST and is not optional:
                                     SpEL throws on a null map index rather than returning null,
                                     so `userById[null]` is a 500 on the whole page, not a blank
                                     cell. `reviewed_by_user_id` is nullable, and a report closed
                                     by a path with no authenticated user has one. -->
                                <span th:if="${r.reviewedByUserId != null and userById[r.reviewedByUserId] != null}"
                                      th:text="${userById[r.reviewedByUserId].fullName} ?: ${userById[r.reviewedByUserId].username}"></span>
                                <span th:if="${r.reviewedAt != null}"
                                      th:text="' — ' + ${@dateUtils.format(r.reviewedAt)}"></span>
                            </div>
                        </td>
                        <td class="text-center enterprise-operation-column">
                            <!-- Admin only. A fault report that anyone who sees it can close
                                 does not actually record that anyone dealt with it. -->
                            <form sec:authorize="hasAuthority('POST:/nfc-fault-reports/{id}/review')"
                                  th:action="@{/nfc-fault-reports/{id}/review(id=${r.id})}" method="post" class="d-inline"
                                  th:data-confirm-message="${r.status.name() == 'REVIEWED'} ? 'این گزارش دوباره به وضعیت بررسی‌نشده برگردد؟' : 'این گزارش به‌عنوان بررسی‌شده علامت زده شود؟'"
                                  data-status-decision
                                  th:data-confirm-title="${r.status.name() == 'REVIEWED'} ? 'بازگرداندن گزارش' : 'تأیید بررسی گزارش'"
                                  th:data-confirm-label="${r.status.name() == 'REVIEWED'} ? 'بله، بازگردانده شود' : 'بله، بررسی شد'"
                                  th:data-confirm-tone="${r.status.name() == 'REVIEWED'} ? 'primary' : 'success'">
                                <input type="hidden" name="returnTo" value="/nfc-fault-reports"/>
                                <input type="hidden" name="reviewed" th:value="${r.status.name() != 'REVIEWED'}"/>
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${r.status.name() == 'REVIEWED'} ? 'btn-outline-secondary' : 'btn-outline-success'"
                                        th:title="${r.status.name() == 'REVIEWED'} ? 'بازکردن دوباره' : 'علامت‌زدن به‌عنوان بررسی‌شده'">
                                    <i class="bi" th:classappend="${r.status.name() == 'REVIEWED'} ? 'bi-arrow-counterclockwise' : 'bi-check2-circle'"></i>
                                </button>
                            </form>
            <!--
              Delete is intentionally NOT offered here.

              The endpoint (POST /nfc-fault-reports/{id}/delete), its ADMIN-only permission and
              NfcFaultReportService.delete all remain in place and tested — the capability is
              kept for a future need, it is simply not exposed in the panel today. A fault
              report is a maintenance record: the workflow is to mark it بررسی‌شده, which keeps
              the history, rather than to erase evidence that a tag failed.

              To bring it back, restore the form below; nothing else needs changing.

              <form th:action="@{/nfc-fault-reports/{id}/delete(id=${r.id})}" method="post" class="d-inline"
                    onsubmit="return confirm('این گزارش برای همیشه حذف می‌شود. ادامه؟');">
                  <input type="hidden" name="returnTo" value="/nfc-fault-reports"/>
                  <button type="submit" class="btn btn-sm btn-outline-danger" title="حذف">
                      <i class="bi bi-trash"></i>
                  </button>
              </form>
            -->
                        </td>
                    </tr>
                    <!-- colspan was 7 against an 8-column header, so the empty message sat under
                         the wrong columns. Two messages, because "nothing matched your filter"
                         and "nothing has ever been reported" call for different next actions. -->
                    <tr th:if="${#lists.isEmpty(reports)}" class="enterprise-empty-row">
                        <td colspan="8" class="text-center text-muted py-4 enterprise-empty-cell"
                            th:text="${totalElements == 0 and #strings.isEmpty(q) and #strings.isEmpty(statusFilter)}
                                     ? 'هیچ گزارش خرابی NFC ثبت نشده است'
                                     : 'گزارشی با این فیلترها یافت نشد'"></td>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>
        <div class="card-footer bg-transparent">
            <div th:replace="~{fragments/list-toolbar :: pagination(basePath='/nfc-fault-reports')}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/operation-confirm :: dialog('شماره گزارش')}"></div>
    <script th:src="@{/js/asset-status-decision.js}"></script>
</div>
</body>
</html>
