spring.application.name=backend-offline-first

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/offline_first_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# ── Production sizing (all commented out on purpose) ──────────────────────────
# Nothing here is set: Boot's defaults are workable for the target box (~16 GB RAM, 2 cores,
# ~50 concurrent users, Postgres often on the same host). These are written down so the
# numbers are a deliberate choice rather than an accident, and so whoever tunes production
# starts from a reasoned baseline instead of guessing. Uncomment (or set the env var) on the
# production host only — leave local `mvnw spring-boot:run` on the defaults.
#
# JVM heap — set on the command line, not here. There is no property for it:
#   java -Xms512m -Xmx2g -jar backend-offline-first.jar
# 2 GB is the starting point when Postgres shares the host; Postgres wants the rest of the RAM
# for its own shared buffers and, more importantly, for the OS page cache that makes its reads
# fast. Going to ~4 GB is reasonable only when the database is remote. Do not hand most of the
# 16 GB to the JVM: a large heap does not make this application faster (it holds little
# long-lived state — attachment bytes stream to disk rather than being buffered), and it
# starves the very cache the database depends on.
#
# Connection pool — Boot's default maximum-pool-size is already 10, which is right for 2 cores;
# a pool larger than the database can usefully run concurrently just moves the queue from the
# application into Postgres. Raise toward 15 only if you see requests waiting on connection
# acquisition. Note the pool is shared with the background workers configured further down
# (audit async up to 4 threads, import async 1), so they count against this number too.
# One more claim to budget for: auditExecutor runs CallerRunsPolicy, so when its queue is
# full the *producing* thread performs the audit INSERT in a REQUIRES_NEW transaction and
# briefly holds a second connection on top of the one it already has. The default of 10
# absorbs that comfortably; do not lower it below ~8.
#spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
#spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
# How long a request waits for a free connection before failing (default 30s). A shorter
# timeout fails fast and visibly under overload instead of letting every thread pile up.
#spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:20000}
#
# HTTP threads — the default cap of 200 is far more than 2 cores can serve; at ~50 concurrent
# users it is never reached, so this changes nothing in normal operation. Its value is as a
# bulkhead: under a burst, 80 threads queue the excess instead of letting 200 threads contend
# for 2 cores and a 10-connection pool, which is how a slow system becomes an unresponsive one.
#server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:80}
#server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
#
# Sizing note: the mobile sync batch endpoint holds one connection for one transaction per
# request (see app.sync.batch-max-items below), so concurrent syncing devices — not just
# people clicking around the panel — draw on the pool as well.

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# The dialect is deliberately NOT set: Hibernate 6 detects PostgreSQL from the connection, and
# naming it explicitly only earns `HHH90000025` on every boot.

# Release the database connection when the service layer finishes, instead of holding it open
# through Thymeleaf rendering.
#
# Safe here for a specific, checkable reason: **no entity in this codebase declares a JPA
# association** — placement and ownership are plain id columns (`sub_function_id`, `class_id`),
# and labels are resolved through explicit batch lookups. There is therefore nothing lazy for a
# view to touch, which is the single thing open-in-view exists to allow. Leaving it on costs a
# pooled connection per request for the whole render, and on the report pages that render is the
# slowest part of the request.
#
# If an `@ManyToOne`/`@OneToMany` is ever introduced, revisit this line before adding it: with
# it false, a view touching a lazy association fails with LazyInitializationException instead of
# silently issuing queries during rendering. That is the better failure, but it is a failure.
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=${SERVER_PORT:8081}
server.address=0.0.0.0

# CORS for the mobile REST API (/api/**) — comma-separated allowed origins, or '*' for any
# origin (current default, matches prior hardcoded behavior). Restrict to the real frontend
# origin(s) before production, e.g.: APP_CORS_ALLOWED_ORIGINS=https://pwa.example.com,http://localhost:5173
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
# Do not persist HTTP sessions to disk between restarts (avoids SPRING_SECURITY_CONTEXT
# deserialization errors with DevTools / classloader changes on restart).
server.servlet.session.persistent=false
# Web panel session idle timeout (mobile API is JWT-based and unaffected).
server.servlet.session.timeout=${SERVER_SERVLET_SESSION_TIMEOUT:60m}

# JWT signing secret for mobile API (min 32 bytes — override in production via env)
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:dev-only-change-me-use-long-random-secret-key!!}

# Login-attempt throttle (in-memory, per app instance) — applies to both /api/auth/login and
# the web /login form (both go through AppAuthenticationProvider). Protects local BCrypt
# brute-force and, more importantly, stops repeated wrong-password attempts through this app
# from tripping Active Directory's own account-lockout policy against a real employee.
app.auth.login-attempt.max-attempts=${APP_AUTH_LOGIN_ATTEMPT_MAX_ATTEMPTS:5}
app.auth.login-attempt.lock-minutes=${APP_AUTH_LOGIN_ATTEMPT_LOCK_MINUTES:15}

# Active Directory / LDAP (user bind: username@domain)
app.auth.ldap.enabled=${APP_AUTH_LDAP_ENABLED:true}
app.auth.ldap.url=${APP_AUTH_LDAP_URL:ldaps://dc.site.hnp:636}
# UPN suffix for bind (username@domain) — must match AD, e.g. a.saljooghi@site.hnp
app.auth.ldap.domain=${APP_AUTH_LDAP_DOMAIN:site.hnp}
app.auth.ldap.timeout-ms=${APP_AUTH_LDAP_TIMEOUT_MS:5000}
# Accept self-signed LDAPS certificate (internal AD only — prefer importing CA to JVM truststore)
app.auth.ldap.trust-self-signed=${APP_AUTH_LDAP_TRUST_SELF_SIGNED:true}
# logging.level.com.hnp.backendofflinefirst.security.LdapAuthenticationService=DEBUG

# Log-sheet scheduler intervals (ms)
app.scheduler.log-sheet-gen-ms=${APP_SCHEDULER_LOG_SHEET_GEN_MS:60000}
app.scheduler.log-sheet-expiry-ms=${APP_SCHEDULER_LOG_SHEET_EXPIRY_MS:60000}
# Max missed occurrences to back-fill per template after an outage
app.scheduler.log-sheet-max-backfill=${APP_SCHEDULER_LOG_SHEET_MAX_BACKFILL:0}

# Logging
app.log.path=${APP_LOG_PATH:ProdLog}
# Text (human-readable columns) is the default -- what you read over SSH. JSON output for
# Filebeat -> Logstash/Elasticsearch writes the same four files under the same names, so
# nothing downstream changes except the parsing. It is selected by the `json-logs` Spring profile (SPRING_PROFILES_ACTIVE=json-logs),
# not by a property — see the header comment in logback-spring.xml for why.
# Rotation is size AND time. Time alone caps only the archive: the current day's file could
# otherwise grow until it fills the disk the app also writes attachments to.
app.log.max-file-size=${APP_LOG_MAX_FILE_SIZE:100MB}
#logging.level.com.hnp.backendofflinefirst.repository=DEBUG
# Uncomment to see service entry/exit (Import becomes very verbose):
#logging.level.com.hnp.backendofflinefirst.service=DEBUG

# Audit trail (async DB writes)
app.audit.enabled=${APP_AUDIT_ENABLED:true}
app.audit.async.core-pool-size=${APP_AUDIT_ASYNC_CORE_POOL_SIZE:2}
app.audit.async.max-pool-size=${APP_AUDIT_ASYNC_MAX_POOL_SIZE:4}
# Queue depth before the producer starts doing audit INSERTs on its own thread
# (CallerRunsPolicy — see AsyncConfig.auditExecutor). Was 256, which a bulk import
# overflowed within seconds; the overflow used to abort the import itself.
app.audit.async.queue-capacity=${APP_AUDIT_ASYNC_QUEUE_CAPACITY:2000}
app.audit.retention.batch-size=${APP_AUDIT_RETENTION_BATCH_SIZE:5000}

# The mobile sync batch endpoint (/api/log-sheets/batch) runs synchronously
# in one DB transaction per request — cap item count so one oversized batch can't tie up a
# connection/thread for an unbounded time (a real offline backlog is realistically in the
# tens-to-low-hundreds per device, not thousands).
app.sync.batch-max-items=${APP_SYNC_BATCH_MAX_ITEMS:500}

# How many assets one log sheet may contain.
#
# Nothing used to bound this: a template whose scope is a plant area resolves to however many
# assets the hierarchy holds, and one entry row is created for each. The count only grows —
# a SCOPE template re-resolves on every run, so a template validated at 140 assets becomes 400
# the day a new plant system is registered, with nobody having edited it.
#
# The first thing that breaks is not the database. It is the tablet, where saving one asset
# rewrites the whole entries array into IndexedDB, so the cost of every save grows with the
# sheet. Then the round itself — a sheet is one operator's claim, and one that cannot be
# finished in a shift cannot be split either.
#
# This used to name a third reason FIRST, and it no longer applies: the web fill page rendered
# every entry in one form and resubmitted all of them on every save, so past Tomcat's default
# max-parameter-count the extra parameters were dropped SILENTLY and arrived at the save path as
# entries with no answers. The page now edits one asset at a time in a dialog that posts only
# that asset, so the parameter count no longer grows with the sheet at all. Recorded rather than
# deleted because the number below was chosen partly for a constraint that is gone — if you are
# here to raise it, the two reasons above are the whole case now, and roadmap.md §8c is the cost
# the web page pays instead.
#
# TWO THRESHOLDS, and which applies depends on who is standing there:
#   max  — REFUSED when saving a template or creating a custom sheet. A human is at the screen
#          and narrowing the scope costs one edit.
#        — WARNED ONLY by the scheduler, which still generates the sheet. Refusing there would
#          mean the round silently does not happen because the plant grew; a large sheet is a
#          worse-looking failure and a much better one to have.
#   warn — a log line for a sheet worth knowing about, below the refusal threshold.
#
# max <= 0 disables the refusal entirely (the escape hatch for a site that genuinely wants one
# enormous sheet). The warning still fires. A warn above max is pulled down to max.
app.log-sheets.max-assets-per-sheet=${APP_LOG_SHEETS_MAX_ASSETS_PER_SHEET:300}
app.log-sheets.warn-assets-per-sheet=${APP_LOG_SHEETS_WARN_ASSETS_PER_SHEET:150}

# Batch Excel import (async jobs) — keep sequential (pool size 1) and cap rows per file
app.import.storage-path=${APP_IMPORT_STORAGE_PATH:./data/imports}
app.import.max-stored-errors=${APP_IMPORT_MAX_STORED_ERRORS:500}
app.import.max-rows=${APP_IMPORT_MAX_ROWS:10000}
app.import.async.core-pool-size=${APP_IMPORT_ASYNC_CORE_POOL_SIZE:1}
app.import.async.max-pool-size=${APP_IMPORT_ASYNC_MAX_POOL_SIZE:1}
# Watchdog for jobs whose worker thread died (ImportJobWatchdog). A healthy import reports
# progress every 25 rows; one that has said nothing for this long is not coming back, and
# while it sits at RUNNING it blocks the next import for every user. Set to 0 to disable.
app.import.stale-timeout-minutes=${APP_IMPORT_STALE_TIMEOUT_MINUTES:15}
app.import.watchdog-ms=${APP_IMPORT_WATCHDOG_MS:60000}

# ── Log-sheet attachments (photo / voice note) ────────────────────────────────
# Where the bytes live. Deliberately the filesystem, not the database: BLOBs wreck backup
# and replication, and every log-sheet read would carry them. Relative paths resolve against
# the process working directory. Back this directory up with the database — the rows and the
# files are only meaningful together.
app.attachments.storage-dir=${APP_ATTACHMENTS_STORAGE_DIR:./data/attachments}
# Per-file ceiling enforced server-side, independent of the multipart limit below. The PWA
# compresses before upload (photos ~200-400 KB, a minute of speech ~150 KB), so anything near
# this is either an uncompressed upload or an attack.
app.attachments.max-file-size-bytes=${APP_ATTACHMENTS_MAX_FILE_SIZE_BYTES:26214400}
# Per-kind ceilings. Counts and durations are admin-editable in the Settings page; byte caps
# are not, because administrators reason in "how many photos", not megabytes. A 480p/700kbps
# video runs ~90 KB/s, so 120 s lands near 11 MB — 20 MB leaves headroom for a high-motion
# scene where the encoder overshoots its bitrate hint.
app.attachments.max-image-bytes=${APP_ATTACHMENTS_MAX_IMAGE_BYTES:5242880}
app.attachments.max-audio-bytes=${APP_ATTACHMENTS_MAX_AUDIO_BYTES:5242880}
app.attachments.max-video-bytes=${APP_ATTACHMENTS_MAX_VIDEO_BYTES:20971520}

# ── Mobile scan policy ────────────────────────────────────────────────────────
# There is no property for it. Whether a PWA scan must also verify the chip's hardware serial
# lives in app_settings ('nfc.strict_serial_match', default ON) so it can be changed from the
# Settings page and take effect on every tablet at its next bootstrap — no restart, no
# redeploy. The case that needs that is time-sensitive: a site whose assets have no serials
# recorded yet has every scan rejected until someone can relax the rule.

# ── Orphan-file sweep ─────────────────────────────────────────────────────────
# Deletes files under the storage root that no attachments row references any more (the usual
# cause is a deleted log sheet: the FK cascade removes the rows and nothing tells the disk).
#
# grace-hours is the safety rail, not a tuning knob. store() writes the file BEFORE the
# transaction commits, so for a moment a perfectly good upload looks exactly like an orphan.
# Never lower this to minutes.
app.attachments.sweep.enabled=${APP_ATTACHMENTS_SWEEP_ENABLED:true}
app.attachments.sweep.grace-hours=${APP_ATTACHMENTS_SWEEP_GRACE_HOURS:24}
# A cron, not an interval: a fixed delay would pin the sweep to whenever the server last
# restarted, so a Tuesday 15:40 restart means every future pass walks the whole storage root at
# 15:40, mid-shift. Default 02:00 local. Examples: every 12h -> "0 0 2,14 * * *";
# every 6h -> "0 0 0,6,12,18 * * *"; weekly Friday 03:00 -> "0 0 3 * * FRI".
app.attachments.sweep.cron=${APP_ATTACHMENTS_SWEEP_CRON:0 0 2 * * *}
# "Midnight" is meaningless without this — a server running in UTC would sweep at 03:30 Tehran.
app.attachments.sweep.zone=${APP_ATTACHMENTS_SWEEP_ZONE:Asia/Tehran}

# ── Log-sheet template guide documents ────────────────────────────────────────
# Groundwork only — the table and entity exist, nothing writes them yet. Kept separate from the
# attachment root so guides (a handful of long-lived documents) are not mixed in with per-sheet
# media (many short-lived files), which makes both easier to back up and reason about.
app.template-guides.storage-dir=${APP_TEMPLATE_GUIDES_STORAGE_DIR:./data/template-guides}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}

# ── Static asset versioning ───────────────────────────────────────────────────
# Every CSS/JS/font URL carries a hash of its own content, so `/css/app.css` is served as
# `/css/app-5e09172f025e….css` and the URL changes whenever the file does.
#
# This exists because of a real failure, not for speed. The panel's assets were served at fixed
# URLs with no version and no cache headers, so a browser that had ever loaded an earlier
# deployment could keep serving itself the old stylesheet indefinitely — returning **200 from
# cache**, never a failed request, with the page silently missing whatever the newer CSS drew.
# Nothing in the console, nothing in the network tab, and identical data: a rendering difference
# with no evidence anywhere. Diagnosing it costs hours; a content hash makes it impossible.
#
# Thymeleaf's `@{...}` rewrites the URLs on its own (through `ResourceUrlEncodingFilter`, which
# Spring Boot registers when the chain is enabled), and `CssLinkResourceTransformer` rewrites the
# links *inside* CSS too — which is what keeps the Vazirmatn `@font-face` sources and the
# Bootstrap Icons font working. Both are worth re-checking after any upgrade: a URL that is not
# rewritten is served unhashed, which is the old behaviour rather than a broken page.
#
# The `max-age` below was held back until every path could be confirmed rewritten, because an
# aggressive cache on a path that slipped through would make the stale-stylesheet problem worse
# rather than better. That condition is now met and is kept met by a test:
# `StaticAssetsAreVersionedTest` fails if a template references an asset by a literal path
# instead of `@{...}`, and if any `url(...)` inside a served stylesheet comes back unhashed —
# which is how the Vazirmatn faces and the Bootstrap Icons font are covered.
#
# Why it is worth having. Without it the panel re-fetches ~726 KB across 19 requests on EVERY
# navigation. The stylesheets block the first paint and the scripts do not, so the page appears
# in an unfinished state and settles a beat later. Caching removes the whole waterfall from the
# second page onwards, and a content hash means a deployment still invalidates instantly: the
# URL changes, so a cached response for the old one is simply never requested again.
#
# One year, because the URL — not the age — is what expires. Note `cachecontrol.*` takes
# precedence over `cache.period`, including the `period=0` that devtools sets, so a local run
# caches too; that is harmless for the same reason (an edited file gets a new hash, hence a new
# URL), but it is why an edit appears immediately rather than after a hard refresh.
spring.web.resources.cache.cachecontrol.max-age=${SPRING_WEB_RESOURCES_CACHE_MAX_AGE:365d}
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Never expose stack traces or raw exception text in HTML error pages
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Actuator — ops monitoring only. Just health + metrics are exposed (never env/beans/
# heapdump/configprops, which can leak secrets). /actuator/health/liveness and
# /actuator/health/readiness stay public (see WebSecurityConfig) for load-balancer /
# watchdog probes; everything else under /actuator/** requires the ADMIN-only
# GET:/actuator/** permission. show-details stays at the safe default (never) so no
# internal detail (DB host, etc.) leaks even to an authenticated caller.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
# Readiness must include the database, and it does NOT by default.
#
# Spring Boot's readiness group contains only `readinessState` out of the box — deliberately, on
# the reasoning that an external dependency being down should not make a pod restart. That
# reasoning is about LIVENESS. For readiness the opposite is true here: with PostgreSQL
# unreachable this application can serve nothing, and a load balancer reading a green
# /actuator/health/readiness would keep sending it traffic that can only fail. Every request
# in this system reads or writes the database; there is no useful degraded mode to stay up for.
#
# Liveness is deliberately left alone (`livenessState` only): a database outage must not cause
# the container to be killed and restarted, which fixes nothing and loses the in-memory session
# registry, login-attempt counters and sweep progress with it.
management.endpoint.health.group.readiness.include=readinessState,db
# Liveness is pinned explicitly rather than left to the default. Overriding the readiness group
# above changes how the auto-configured probe groups resolve, and liveness was observed picking
# up `db` as a result — which is precisely the wrong dependency for it: a database outage would
# then get the container killed and restarted, losing the in-memory session registry,
# login-attempt counters and sweep progress, and fixing nothing. Naming both groups means
# neither can drift because the other was configured.
management.endpoint.health.group.liveness.include=livenessState

# ── Third-party integration API (/integration/v1/**) ──────────────────────────
# Authenticated by an X-API-Key header on its own filter chain — no user, no session, no JWT.
# Keys are issued and revoked from the admin panel (/integration-keys); nothing here turns the
# API on or off, because an API with no valid key issued is already off.
#
# The zone a date with no offset is interpreted in. Deliberately a property and not
# ZoneId.systemDefault(): the meaning of `from=2026-08-01` must not change because somebody
# fixed the server's clock settings or moved the app into a container that runs in UTC.
app.integration.default-zone=${APP_INTEGRATION_DEFAULT_ZONE:Asia/Tehran}
#
# How many log sheets one page of the integration list may carry, and how many it carries when
# the caller does not ask. Configurable because the right number depends on the integration —
# a nightly bulk pull and a minute-by-minute poller want very different pages — and neither is
# worth a redeploy to change.
#
# A request larger than the maximum is CLAMPED, not refused, and the effective size is echoed
# back as `size` in the response so the caller can see it happened.
#
# The maximum is itself capped at 1,000 (IntegrationLogSheetQuery.ABSOLUTE_MAX_PAGE_SIZE): the
# cap exists so no single request becomes unbounded, and an extra zero typed here must not be
# able to remove it. A clamped value is logged at WARN on startup rather than applied silently.
app.integration.max-page-size=${APP_INTEGRATION_MAX_PAGE_SIZE:200}
app.integration.default-page-size=${APP_INTEGRATION_DEFAULT_PAGE_SIZE:50}
#
# Usage-log retention. Every integration request writes one api_key_usage row — an integration
# polling once a minute is ~1,400 rows a day — so the table needs a purge that nobody has to
# remember to run. How long rows are kept comes from `audit.retention.days` in app_settings
# (the same policy question, answered once); only the schedule and batch size are here.
# A cron rather than an interval, so a mid-afternoon restart cannot pin the purge to mid-shift
# forever. 03:00 local, an hour after the attachment sweep so the two do not contend.
app.integration.usage-retention.enabled=${APP_INTEGRATION_USAGE_RETENTION_ENABLED:true}
app.integration.usage-retention.cron=${APP_INTEGRATION_USAGE_RETENTION_CRON:0 0 3 * * *}
app.integration.usage-retention.zone=${APP_INTEGRATION_USAGE_RETENTION_ZONE:Asia/Tehran}
app.integration.usage-retention.batch-size=${APP_INTEGRATION_USAGE_RETENTION_BATCH_SIZE:5000}

# OpenAPI / Swagger UI for the mobile REST API (/api/**) and the third-party integration API
# (/integration/**) — the Thymeleaf admin panel is server-rendered HTML, not a machine-consumed
# API, so it's excluded from scanning.
# Enabled in every environment, including production, but gated behind the ADMIN-only
# GET:/v3/api-docs/** permission (see WebSecurityConfig) — same pattern as Actuator.
# The integration paths are included so an administrator can hand an integrator a generated
# spec instead of a hand-written description that drifts. The spec is still admin-only: it
# documents the API, it does not grant access to it.
# UI: /swagger-ui.html — spec: /v3/api-docs.
springdoc.paths-to-match=/api/**,/integration/**
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
