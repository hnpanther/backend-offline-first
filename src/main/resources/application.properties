spring.application.name=backend-offline-first

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/offline_first_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=${SERVER_PORT:8081}
server.address=0.0.0.0

# CORS for the mobile REST API (/api/**) — comma-separated allowed origins, or '*' for any
# origin (current default, matches prior hardcoded behavior). Restrict to the real frontend
# origin(s) before production, e.g.: APP_CORS_ALLOWED_ORIGINS=https://pwa.example.com,http://localhost:5173
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
# Do not persist HTTP sessions to disk between restarts (avoids SPRING_SECURITY_CONTEXT
# deserialization errors with DevTools / classloader changes on restart).
server.servlet.session.persistent=false
# Web panel session idle timeout (mobile API is JWT-based and unaffected).
server.servlet.session.timeout=${SERVER_SERVLET_SESSION_TIMEOUT:60m}

# JWT signing secret for mobile API (min 32 bytes — override in production via env)
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:dev-only-change-me-use-long-random-secret-key!!}

# Login-attempt throttle (in-memory, per app instance) — applies to both /api/auth/login and
# the web /login form (both go through AppAuthenticationProvider). Protects local BCrypt
# brute-force and, more importantly, stops repeated wrong-password attempts through this app
# from tripping Active Directory's own account-lockout policy against a real employee.
app.auth.login-attempt.max-attempts=${APP_AUTH_LOGIN_ATTEMPT_MAX_ATTEMPTS:5}
app.auth.login-attempt.lock-minutes=${APP_AUTH_LOGIN_ATTEMPT_LOCK_MINUTES:15}

# Active Directory / LDAP (user bind: username@domain)
app.auth.ldap.enabled=${APP_AUTH_LDAP_ENABLED:true}
app.auth.ldap.url=${APP_AUTH_LDAP_URL:ldaps://dc.site.hnp:636}
# UPN suffix for bind (username@domain) — must match AD, e.g. a.saljooghi@site.hnp
app.auth.ldap.domain=${APP_AUTH_LDAP_DOMAIN:site.hnp}
app.auth.ldap.timeout-ms=${APP_AUTH_LDAP_TIMEOUT_MS:5000}
# Accept self-signed LDAPS certificate (internal AD only — prefer importing CA to JVM truststore)
app.auth.ldap.trust-self-signed=${APP_AUTH_LDAP_TRUST_SELF_SIGNED:true}
# logging.level.com.hnp.backendofflinefirst.security.LdapAuthenticationService=DEBUG

# Log-sheet scheduler intervals (ms)
app.scheduler.log-sheet-gen-ms=${APP_SCHEDULER_LOG_SHEET_GEN_MS:60000}
app.scheduler.log-sheet-expiry-ms=${APP_SCHEDULER_LOG_SHEET_EXPIRY_MS:60000}
# Max missed occurrences to back-fill per template after an outage
app.scheduler.log-sheet-max-backfill=${APP_SCHEDULER_LOG_SHEET_MAX_BACKFILL:0}

# Logging
app.log.path=${APP_LOG_PATH:ProdLog}
#logging.level.com.hnp.backendofflinefirst.repository=DEBUG
# Uncomment to see service entry/exit (Import becomes very verbose):
#logging.level.com.hnp.backendofflinefirst.service=DEBUG

# Audit trail (async DB writes)
app.audit.enabled=${APP_AUDIT_ENABLED:true}
app.audit.async.core-pool-size=${APP_AUDIT_ASYNC_CORE_POOL_SIZE:2}
app.audit.async.max-pool-size=${APP_AUDIT_ASYNC_MAX_POOL_SIZE:4}
app.audit.retention.batch-size=${APP_AUDIT_RETENTION_BATCH_SIZE:5000}

# The mobile sync batch endpoint (/api/log-sheets/batch) runs synchronously
# in one DB transaction per request — cap item count so one oversized batch can't tie up a
# connection/thread for an unbounded time (a real offline backlog is realistically in the
# tens-to-low-hundreds per device, not thousands).
app.sync.batch-max-items=${APP_SYNC_BATCH_MAX_ITEMS:500}

# Batch Excel import (async jobs) — keep sequential (pool size 1) and cap rows per file
app.import.storage-path=${APP_IMPORT_STORAGE_PATH:./data/imports}
app.import.max-stored-errors=${APP_IMPORT_MAX_STORED_ERRORS:500}
app.import.max-rows=${APP_IMPORT_MAX_ROWS:10000}
app.import.async.core-pool-size=${APP_IMPORT_ASYNC_CORE_POOL_SIZE:1}
app.import.async.max-pool-size=${APP_IMPORT_ASYNC_MAX_POOL_SIZE:1}

# ── Log-sheet attachments (photo / voice note) ────────────────────────────────
# Where the bytes live. Deliberately the filesystem, not the database: BLOBs wreck backup
# and replication, and every log-sheet read would carry them. Relative paths resolve against
# the process working directory. Back this directory up with the database — the rows and the
# files are only meaningful together.
app.attachments.storage-dir=${APP_ATTACHMENTS_STORAGE_DIR:./data/attachments}
# Per-file ceiling enforced server-side, independent of the multipart limit below. The PWA
# compresses before upload (photos ~200-400 KB, a minute of speech ~150 KB), so anything near
# this is either an uncompressed upload or an attack.
app.attachments.max-file-size-bytes=${APP_ATTACHMENTS_MAX_FILE_SIZE_BYTES:10485760}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}

# Never expose stack traces or raw exception text in HTML error pages
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Actuator — ops monitoring only. Just health + metrics are exposed (never env/beans/
# heapdump/configprops, which can leak secrets). /actuator/health/liveness and
# /actuator/health/readiness stay public (see WebSecurityConfig) for load-balancer /
# watchdog probes; everything else under /actuator/** requires the ADMIN-only
# GET:/actuator/** permission. show-details stays at the safe default (never) so no
# internal detail (DB host, etc.) leaks even to an authenticated caller.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger UI for the mobile REST API (/api/**) only — the Thymeleaf admin panel
# is server-rendered HTML, not a machine-consumed API, so it's excluded from scanning.
# Enabled in every environment, including production, but gated behind the ADMIN-only
# GET:/v3/api-docs/** permission (see WebSecurityConfig) — same pattern as Actuator.
# UI: /swagger-ui.html — spec: /v3/api-docs.
springdoc.paths-to-match=/api/**
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
