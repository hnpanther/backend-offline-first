# The application, as one container on its own host.
#
# PostgreSQL and nginx are deliberately NOT here: in the target topology they are separate
# servers with their own compose files, and SPRING_DATASOURCE_URL in app.env points at the
# database host across the network. Keeping them out of this file also keeps somebody from
# running a production database as a side effect of starting the application.
#
#   cd deploy/app
#   cp app.env.example app.env && chmod 600 app.env    # then fill it in — the JWT secret above all
#   docker compose up -d
#   docker compose logs -f app     # read the boot block; see "what to look for" in app.env.example
#
# To build the image from a jar this checkout already produced, from the REPOSITORY ROOT:
#   mvn -o clean package && docker compose -f deploy/app/docker-compose.yml build
#
# The full Linux runbook, in order and with every command, is docs/deployment.md
# § "Docker on Linux — the complete runbook".
#
# ---------------------------------------------------------------------------------------------
# ONE INSTANCE PER DATABASE. Not a performance guideline — a correctness one.
#
# `docker compose up -d` is safe: it stops the old container before starting the new one.
# `docker compose up --scale app=2` is not, and neither is a second `docker run` beside this.
# Log sheet generation defends itself (a losing instance rolls its rounds back and logs a
# warning), but nothing else does: the three storage directories are not shared, and a second
# instance starting will mark the import the first one is *running* as failed and delete its
# uploaded file. docs/roadmap.md §19 is the full inventory.
# ---------------------------------------------------------------------------------------------

# An explicit project name. Without it compose derives one from the directory, which here would
# be the useless and collision-prone "app" — and the project name is what prefixes every volume
# and network, so two stacks that both call themselves "app" quietly share them.
name: logsheet-app

services:
  app:
    # The image to run. APP_VERSION is read by COMPOSE ITSELF — from the shell or a .env file
    # beside this one, not from app.env — so `APP_VERSION=1.0.1 docker compose up -d` switches
    # version without editing anything. The tag is the answer to "what is in production": never
    # `latest`.
    image: logsheet-backend:${APP_VERSION:-1.0.0}

    # Only used by `docker compose build`. The context is the repository root, because the
    # Dockerfile copies the jar out of target/ — and .dockerignore, which lives at that root,
    # narrows the context to exactly that one jar. The jar must already exist: run
    # `mvn -o clean package` first.
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}

    # A fixed name so `docker logs logsheet-app` works without looking anything up.
    container_name: logsheet-app

    # Restart on any exit, across reboots, but NOT after an explicit `docker compose stop` —
    # which is what an operator uses to take the application down on purpose.
    restart: unless-stopped

    # Everything environment-specific. These go into the container; see app.env.example, where
    # every variable is explained. chmod 600 the real file: it holds the JWT key and the
    # database password.
    env_file:
      - ./app.env

    ports:
      # host:container. The application always listens on 8081 INSIDE the container; only the
      # left-hand side is yours to choose.
      #
      # Both halves come from the shell or a `.env` file beside this one — NOT from app.env,
      # which compose does not read for substitution. The defaults are deliberately the safest
      # possible: a file nobody configured publishes on loopback only and is reachable from
      # nothing but this host.
      #
      #   APP_BIND_IP=10.0.0.12  APP_PORT=8081   the application host's private address
      #   APP_BIND_IP=10.0.0.12  APP_PORT=80     publish on 80 — works even though the container
      #                                          is non-root, because the host-side socket is
      #                                          opened by the Docker daemon
      #
      # ⚠ A published port BYPASSES ufw. Docker writes its own DNAT rules into the nat table,
      # which are evaluated before ufw's INPUT chain ever sees the packet, so
      # `ufw deny 8081` does not close a port published on 0.0.0.0. Binding to one address is
      # the control that actually works; a firewall rule in the DOCKER-USER chain is the other.
      # See docs/deployment.md § "Publishing on port 80 instead of 8081".
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8081}:8081"

    volumes:
      # NAMED VOLUMES, and that is deliberate for all four.
      #
      # A named volume inherits the ownership the image gave the directory (uid 10001, set in
      # deploy/Dockerfile). A BIND MOUNT does not: a host directory keeps the ownership the host
      # gave it, normally root:root, and the process inside this container is uid 10001 with no
      # way to become anything else. What you see then is not a permission message — it is a
      # Logback stack trace at start-up, or an attachment upload that fails with a server error,
      # and both read like a code fault.
      #
      # To put these on the host anyway — because the attachments belong on an LVM volume with
      # its own backup schedule, or the logs where your collector looks — hand the directories
      # over FIRST and then replace the four lines below with the four paths:
      #
      #   sudo mkdir -p /srv/logsheet/{attachments,imports,template-guides,logs}
      #   sudo chown -R 10001:10001 /srv/logsheet
      #   sudo chmod 750 /srv/logsheet/*
      #
      #   - /srv/logsheet/attachments:/data/attachments
      #   - /srv/logsheet/imports:/data/imports
      #   - /srv/logsheet/template-guides:/data/template-guides
      #   - /srv/logsheet/logs:/logs
      #
      # ⚠ The container paths are fixed by the image and must match APP_*_STORAGE_DIR in
      # app.env exactly — including the plural in `/data/attachments`. The image creates and
      # chowns that path; a mount at `/data/attachment` is a different directory that the image
      # never prepared, and the failure surfaces at the first upload rather than at boot, so it
      # survives every smoke test.

      # Operators' photographs, voice notes and video. THIS is the volume that must be backed up
      # together with the database — a row without its bytes is not a reading.
      - attachments:/data/attachments
      # Uploaded Excel files, consumed by the import jobs.
      - imports:/data/imports
      # Template guide documents.
      - guides:/data/template-guides
      # Logback's rotating files. Drop this line entirely if you ship stdout to a collector
      # instead (SPRING_PROFILES_ACTIVE=json-logs in app.env makes those lines machine-readable).
      - logs:/logs

    # --- hardening -----------------------------------------------------------------------
    # The image already runs as uid 10001; this states it so a `docker inspect` shows it and a
    # future base-image change cannot silently promote the process to root.
    user: "10001:10001"
    read_only: true
    tmpfs:
      # Tomcat's multipart staging and its work directory live under java.io.tmpdir. Attachment
      # uploads pass through here, so size it above the largest request you accept
      # (spring.servlet.multipart.max-request-size is 50 MB by default).
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # SIGTERM reaches the JVM, whose Spring shutdown hook closes the connection pool and the
    # executors. The default 10 s is tight for a bulk import holding a transaction; 30 s lets it
    # finish instead of being killed mid-write.
    #
    # This does NOT drain in-flight HTTP requests — that is `server.shutdown=graceful`, an
    # application property this project does not set. Add it to app.env as
    # SERVER_SHUTDOWN=graceful if you want it; it is a behaviour change, not a compose one.
    stop_grace_period: 30s

    deploy:
      replicas: 1              # read the ONE INSTANCE PER DATABASE banner at the top of this file
      resources:
        limits:
          # The entrypoint takes 60% of this as heap (-XX:MaxRAMPercentage=60), so 6g here is
          # ~3.6 GB of heap — what the README's sizing table asks for when PostgreSQL is on
          # another host. Change this number and the heap follows; that is the point of it.
          memory: 6g
          cpus: "3.5"
        reservations:
          # A floor the scheduler keeps free for this container. Matters on a host that runs
          # anything else; harmless on a dedicated one.
          memory: 2g

    healthcheck:
      # Inherited from the image; repeated here so `docker compose ps` explains itself. Readiness,
      # not liveness, and not /api/health: only this one includes the database, so a container
      # cannot report healthy while PostgreSQL is unreachable.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

    # Only needed when the database is a container on THIS host rather than its own machine —
    # `host.docker.internal` does not resolve on Linux without it. Prefer the database host's
    # real address in SPRING_DATASOURCE_URL: `host.docker.internal` does not say WHICH PostgreSQL
    # it reaches, and reaching the wrong one boots silently (Flyway only warns when the schema is
    # ahead of the jar, and ddl-auto=validate can still pass).
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

    # Docker's own capture of stdout — separate from Logback's files under /logs. Capped so a
    # chatty day cannot fill the host's disk: five files of 50 MB, oldest discarded.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  attachments:
  imports:
  guides:
  logs:
